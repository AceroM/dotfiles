id = "miguel.quick-pickers"
name = "Quick Pickers"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Fast local pickers for Herdr agents and spaces"
platforms = ["macos"]

[[actions]]
id = "agents"
title = "Browse agents by attention"
contexts = ["global"]
command = ["/bin/sh", "open.sh", "agents"]

[[actions]]
id = "spaces"
title = "Browse spaces"
contexts = ["global"]
command = ["/bin/sh", "open.sh", "spaces"]

[[actions]]
id = "move"
title = "Move tab to space"
contexts = ["global"]
command = ["/bin/sh", "open.sh", "move"]

[[panes]]
id = "agents"
title = "Agents"
placement = "popup"
width = "76%"
height = "64%"
command = ["bun", "picker.ts", "agents"]

[[panes]]
id = "spaces"
title = "Spaces"
placement = "popup"
width = "62%"
height = "50%"
command = ["bun", "picker.ts", "spaces"]

[[panes]]
id = "move"
title = "Move tab to space"
placement = "popup"
width = "62%"
height = "50%"
command = ["bun", "picker.ts", "move"]

[[actions]]
id = "tabs"
title = "Browse tabs"
contexts = ["global"]
command = ["/bin/sh", "open.sh", "tabs"]

[[actions]]
id = "sessions"
title = "Resume a recent Claude/Codex session"
contexts = ["global"]
command = ["/bin/sh", "open.sh", "sessions"]

[[panes]]
id = "tabs"
title = "Tabs"
placement = "popup"
width = "62%"
height = "60%"
command = ["bun", "picker.ts", "tabs"]

[[panes]]
id = "sessions"
title = "Recent sessions"
placement = "popup"
width = "80%"
height = "60%"
command = ["bun", "sessions.ts"]

[[actions]]
id = "grep"
title = "Grep other panes' visible screens"
contexts = ["global"]
command = ["/bin/sh", "open.sh", "grep"]

[[panes]]
id = "grep"
title = "Grep panes"
placement = "popup"
width = "80%"
height = "70%"
command = ["bun", "picker.ts", "grep"]
