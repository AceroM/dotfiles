id = "miguel.nvim-links"
name = "Neovim File Links"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Ctrl-click code locations to open them in a sibling Neovim pane, else in a centered Neovim popup"
platforms = ["macos", "linux"]

[[actions]]
id = "open"
title = "Open code location in sibling Neovim"
command = ["python3", "open.py"]

[[link_handlers]]
id = "file-location"
title = "Open path:line in Neovim"
pattern = '^@?[^:\s]+:[0-9]+(:[0-9]+)?(-[0-9]+)?$'
action = "open"

[[link_handlers]]
id = "file-uri"
title = "Open terminal file hyperlink in Neovim"
pattern = '^file://'
action = "open"

# A clicked location with no Neovim beside it (al's preview, a lone agent)
# opens here instead: Neovim in a centered popup, gone when it quits.
[[panes]]
id = "float"
title = "Neovim"
placement = "popup"
width = "84%"
height = "84%"
command = ["/bin/sh", "float.sh"]
