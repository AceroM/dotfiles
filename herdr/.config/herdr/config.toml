onboarding = false
# Herdr configuration
# Stowed with: stow herdr  ->  ~/.config/herdr/config.toml
#
# See `herdr --default-config` for the full annotated reference.
# Apply edits to the running server with `herdr server reload-config` (or `hr`).
#
# Binding syntax:
#   "prefix+n"      -> requires the prefix key first (default ctrl+b)
#   "ctrl+alt+n"    -> direct chord, works straight from terminal mode
# Anything left commented out keeps its documented default, so every stock
# prefix binding (prefix+c, prefix+w, prefix+hjkl ...) still works alongside
# the direct chords below.

[theme]
# Herdr defaults to catppuccin (base #1e1e2e, a cool purple-black). Ghostty
# here runs its stock theme, whose background is #282c34 -- warm neutral gray,
# i.e. One Dark. Stacking the two made herdr's chrome read as a differently
# tinted sheet laid over the terminal. one-dark shares Ghostty's exact
# background, so the panel stops looking like a separate surface.
name = "one-dark"

[theme.custom]
# --- Tabs ---------------------------------------------------------------
# The active tab is a solid fill of the theme's blue/accent, so a saturated
# accent turns it into the loudest element on screen. #81a2be is Ghostty's own
# ANSI blue (palette 4), so the active tab now agrees with every other blue the
# terminal draws instead of competing with it.
# Want more pop back? Delete these two lines to fall back to One Dark's #61afef.
accent = "#81a2be"
blue = "#81a2be"

# --- Active highlights --------------------------------------------------
# Selected space/agent rows are painted with the surface tokens. The stock
# values sit only a couple of steps off panel_bg, which is close to invisible
# on a dark background. These are One Dark's real surface/selection greys, so
# a selected row actually reads as selected.
panel_bg = "#21252b"
surface_dim = "#23272e"
surface0 = "#2c313c"
surface1 = "#3e4451"
overlay0 = "#5c6370"
overlay1 = "#7f848e"

[keys]
# --- Tabs ---------------------------------------------------------------
# ctrl+alt+n opens a tab, ctrl+alt+x closes it, ctrl+alt+h/l walk between
# them (same left/right feel as vim's h/l).
new_tab = "ctrl+alt+n"
close_tab = "ctrl+alt+x"
previous_tab = "ctrl+alt+h"
next_tab = "ctrl+alt+l"
rename_tab = "ctrl+alt+r"

# --- Workspaces ("spaces") ---------------------------------------------
# ctrl+alt+j/k move down/up the workspace list in the sidebar, mirroring
# the tab motion one axis over. ctrl+alt+shift+w opens the workspace picker
# to jump straight to one by name (plain ctrl+alt+w closes a pane, browser
# style).
next_workspace = "ctrl+alt+j"
previous_workspace = "ctrl+alt+k"
workspace_picker = "ctrl+alt+shift+w"
rename_workspace = "ctrl+alt+shift+r"
new_workspace = "ctrl+alt+shift+n"

# --- Agents -------------------------------------------------------------
# Shift on the same j/k axis hops between agent rows instead of workspaces.
next_agent = "ctrl+alt+shift+j"
previous_agent = "ctrl+alt+shift+k"

# --- Panes --------------------------------------------------------------
# hjkl is already spent on tabs/workspaces, so pane focus uses the arrows.
focus_pane_left = "ctrl+alt+left"
focus_pane_down = "ctrl+alt+down"
focus_pane_up = "ctrl+alt+up"
focus_pane_right = "ctrl+alt+right"
split_vertical = "ctrl+alt+v"
split_horizontal = "ctrl+alt+minus"
# ctrl+alt+w closes the focused pane; the tab only goes away once its last
# pane is gone. ctrl+alt+x is the deliberate "close the whole tab" chord.
close_pane = "ctrl+alt+w"
rename_pane = "ctrl+alt+shift+p"
zoom = "ctrl+alt+z"

# --- Chrome -------------------------------------------------------------
toggle_sidebar = "ctrl+alt+b"

# --- Indexed tabs -------------------------------------------------------
# ctrl+alt+1..9 jumps straight to the Nth tab -- browser muscle memory, and the
# same ctrl+alt chord family as everything above. Bare alt+1..9 stays off the
# table: Raycast claims it globally. ctrl+alt+digit has no legacy terminal
# encoding, but herdr pushes the kitty keyboard enhancement flags and Ghostty
# answers in CSI-u (ctrl+alt+1 -> CSI 49;7u), so the chord arrives intact.
switch_tab = "ctrl+alt+1..9"

# --- Indexed spaces -----------------------------------------------------
# cmd+alt+shift+1..9 jumps straight to the Nth space in the sidebar: the indexed
# sibling of ctrl+alt+j/k (one row at a time) and ctrl+alt+u/i (the two ends).
# Tabs already own the ctrl+alt+digit chord, so the space axis moves to the cmd
# side of the keyboard rather than stacking a fourth modifier on top of it.
#
# Ghostty keeps bare cmd+1..9 for its own goto_tab, but leaves cmd+alt+shift+digit
# unbound, and its kitty-protocol encoding carries the super bit
# (cmd+alt+shift+1 -> CSI 49;12u), so the chord arrives intact -- the same
# mechanism switch_tab above relies on.
switch_workspace = "cmd+alt+shift+1..9"

# ctrl+alt+u/i -- jump to the first/last space in the sidebar. ctrl+alt+j/k walk
# the list one row at a time; these are the two ends of that same axis, and u/i
# sit directly above j/k on the home row, so the "one row" and "all the way"
# motions stay in one finger cluster. (This used to be a lone ctrl+alt+g for the
# bottom end, on vim's G; keeping both ends means the pair reads better as u=up,
# i=down than as g/shift+g.)
#
# Herdr has no first_workspace/last_workspace action to bind -- switch_workspace
# is an indexed 1..9 binding, which cannot name "whichever is last" -- so these go
# through a script that reads `workspace list` and focuses the edge of the array.
# `type = "shell"` gets spawned detached with the server's environment, so the
# command is wrapped in an explicit /bin/sh rather than trusting $PATH to contain
# ~/.local/bin.
#
# ctrl+i is legacy-encoded as Tab, but herdr pushes the kitty keyboard flags and
# Ghostty answers in CSI-u (ctrl+alt+i -> CSI 105;7u), so the chord is distinct
# from a real Tab -- same mechanism the ctrl+alt+1..9 binding relies on.
#
# ctrl+alt+g used to sit on the last-space job (and lazygit-in-a-popup before
# that); it now has no binding at all.
[[keys.command]]
key = "ctrl+alt+u"
type = "shell"
description = "First space"
command = '/bin/sh -c "exec $HOME/.local/bin/herdr-space-edge first"'

[[keys.command]]
key = "ctrl+alt+i"
type = "shell"
description = "Last space"
command = '/bin/sh -c "exec $HOME/.local/bin/herdr-space-edge last"'

# ctrl+alt+; -- new tab already running the agent I pressed from, same cwd, same
# flags. ctrl+alt+n's shell-tab sibling: ';' sits right of 'l', so it lands in
# the same right-hand cluster as the h/l tab motion.
#
# There is no built-in action for this, so it goes through a script that reads
# the focused pane and then drives `tab create` + `agent start`. `type = "shell"`
# gets spawned detached with the server's environment, so the command is wrapped
# in an explicit /bin/sh rather than trusting $PATH to contain ~/.local/bin.
[[keys.command]]
key = "ctrl+alt+semicolon"
type = "shell"
command = '/bin/sh -c "exec $HOME/.local/bin/herdr-agent-tab"'

[ui]
# Borders and navigate-mode UI default to cyan, which would be a third hue
# alongside the tab blue and the grey chrome. Pin it to the same steel blue.
accent = "#81a2be"

# ctrl+alt+n should feel like a browser new-tab, so skip the name prompt.
# Flip to true to be asked for a tab name on every create.
prompt_new_tab_name = false

# Workspaces are long-lived and picked by name (ctrl+alt+shift+w), so always
# ask for one on ctrl+alt+shift+n instead of taking a generated name.
prompt_new_workspace_name = true
