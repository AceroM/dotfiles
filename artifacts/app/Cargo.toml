[package]
name = "artifacts-app"
version = "0.1.0"
edition = "2021"
description = "Native window for the artifacts server: the page list beside a webview"

[[bin]]
name = "artifacts-app"
path = "src/main.rs"

[dependencies]
# syntect: the code panel's highlighting (bat's ~200 languages, no tree-sitter grammars or LSP).
gpui-kit = { version = "0.8.1", features = ["syntect"] }
gpui-webview = "0.8.1"
# The wry gpui-webview builds on, for its WebViewBuilder.
wry = { package = "lb-wry", version = "0.53.3" }
async-channel = "2"
chrono ={ version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["json"] }
