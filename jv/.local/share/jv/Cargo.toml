[package]
name = "jv"
version = "0.1.0"
edition = "2021"
description = "PR diff viewer: a GitHub-style file tree beside delta-style, syntax-highlighted hunks"

[dependencies]
ratatui = "0.30"
# Same crossterm ratatui uses, plus use-dev-tty: `git diff | jv` reads keys
# from /dev/tty, which macOS kqueue (crossterm's default backend) can't poll.
crossterm = { version = "0.29", features = ["use-dev-tty"] }
syntect = { version = "5.3", default-features = false, features = ["parsing", "regex-onig", "dump-load"] }
two-face = "0.4"
similar = "2.7"
unicode-width = "0.2"

[profile.release]
lto = "thin"
codegen-units = 4
debug = false
