[package]
name = "tk"
version = "0.1.0"
edition = "2021"
description = "Tab kill: every Chrome tab in a centered list, j/k to move, ; to close"

[dependencies]
ratatui = "0.30"
# The browser-use native host speaks newline-delimited JSON.
serde_json = "1"
unicode-width = "0.2"

[profile.release]
lto = "thin"
codegen-units = 4
debug = false
