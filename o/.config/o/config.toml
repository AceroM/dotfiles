# o's configurations: the agents ⏎ can start in a new Rex tab. The prompt
# shows the one it's on (`claude(opus) >`); ⇧tab goes to the next, ^1 … ^9
# straight to the Nth, in the order they're listed here. o starts on the one
# picked last (kept in ~/.local/state/o/last-agent), else the first; $O_AGENT
# names one instead (O_AGENT=codex). `o --config` shows what o read.
#
#   kind   the command: claude, codex
#   model  passed as --model MODEL, and shown: claude(fable)
#   args   the agent's own arguments
#   name   shown instead of kind(model)
#
# Claude profiles (accounts) aren't listed here: o finds this computer's own,
# ~/.claude and each ~/.claude-NAME Claude Code has run in (as c2's
# CLAUDE_CONFIG_DIR=~/.claude-2), and ^n picks the one the claude entries
# start on: `claude(opus)·2 >`. `o --config` lists them with their limits.

# The most columns o draws in, `claude(opus) > ` included, from the pane's
# left edge: a wide pane doesn't stretch the text across it. 100 wraps the
# text at about 80. Left out: 100; 0: the pane's whole width.
max_width = 100

# Provider pairs: odd shortcuts are everyday, even shortcuts are deeper reasoning.
# Ctrl+1 / Ctrl+2: Claude Opus / Fable.
[[agent]]
kind = "claude"
model = "opus"
args = ["--dangerously-skip-permissions"]

[[agent]]
kind = "claude"
model = "fable"
args = ["--dangerously-skip-permissions"]

# Ctrl+3 / Ctrl+4: Codex Sol 6.1 xhigh / Astra 6 max.
# Both run in this process, not on Codex's background server.
# Pin both normal and plan-mode effort so global defaults cannot change the pair.
[[agent]]
kind = "codex"
model = "gpt-6.1-sol"
name = "codex(sol)"
args = ["--no-daemon", "--yolo", "-c", 'model_reasoning_effort="xhigh"', "-c", 'plan_mode_reasoning_effort="xhigh"']

[[agent]]
kind = "codex"
model = "gpt-6-astra"
name = "codex(astra)"
args = ["--no-daemon", "--yolo", "-c", 'model_reasoning_effort="max"', "-c", 'plan_mode_reasoning_effort="max"']
