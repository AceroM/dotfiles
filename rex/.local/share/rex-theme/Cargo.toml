[package]
name = "rex-theme"
version = "0.1.0"
edition = "2021"
description = "The colors ctab, tk, al, jv and o draw with: Rex's current theme inside Rex, One Dark elsewhere"

[dependencies]
# Color, the type the tools draw with. The same 0.30 they all use, so it builds once.
ratatui = { version = "0.30", default-features = false }
# Rex's design tokens (themes.json in its app bundle) are JSON.
serde_json = "1"
