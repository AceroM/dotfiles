[package]
name = "tg"
version = "0.1.0"
edition = "2021"
description = "Chrome tab groups (tg): a centered list for removing tab groups"

# The browser-use host, the colors (Rex's theme when inside Rex), text helpers. (ct shared them
# until it moved to Go in ../ct.)
[lib]
name = "tabkit"
path = "src/lib.rs"

[[bin]]
name = "tg"
path = "src/bin/tg/main.rs"

[dependencies]
# tg: macOS accessibility (Chrome's saved-group menus) and Rex's theme preference.
core-foundation = "0.10.1"
ratatui = "0.30"
# tg: Chrome's sync store (saved tab groups), read from a copy.
rusty-leveldb = "4.0.2"
# The browser-use native host speaks newline-delimited JSON.
serde_json = "1"
unicode-width = "0.2"

[profile.release]
lto = "thin"
codegen-units = 4
debug = false
