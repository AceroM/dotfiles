[package]
name = "oc"
version = "0.1.0"
edition = "2021"
description = "A prompt box, as `claude >` and `codex ›` have: ⏎ starts the agent with it in a new Herdr tab"

[dependencies]
ratatui = "0.30"
# Same crossterm ratatui uses, plus use-dev-tty (as in al and jv): keys come
# from /dev/tty, which macOS kqueue (crossterm's default backend) can't poll.
crossterm = { version = "0.29", features = ["use-dev-tty"] }
# Herdr's answers are JSON.
serde_json = "1"
unicode-width = "0.2"
# Double-click words split at Unicode's word boundaries.
unicode-segmentation = "1"
# poll(2) for the terminal's answers at startup (probe.rs).
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 4
debug = false
